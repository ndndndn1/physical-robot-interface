[project]
name = "physical-robot-interface"
version = "0.1.0"
description = "Vendor-neutral robot command contracts and deterministic mock runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.141,<0.142",
  "httpx>=0.27,<0.29",
  "pydantic>=2.9,<3",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.30,<0.36",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
physical-robot = "physical_robot.cli:main"
physical-robot-conformance = "physical_robot.conformance:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physical_robot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["physical_robot"]
